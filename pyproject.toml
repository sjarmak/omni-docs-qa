[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-docs-qa"
version = "0.1.0"
description = "Cited documentation Q&A, coverage verdicts, a gap-to-fix loop, and regression evals on Omni"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "pyyaml>=6,<7",
  "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["omni_docs_qa"]

[tool.coverage.report]
fail_under = 80
show_missing = true
